name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # The playground computes its bytes, JSON and text with this library built
      # to JavaScript. The build product is not committed.
      - name: build the playground engine
        run: |
          moon update
          moon build --target js --release src/examples/browser
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moonproto.js

      # The reference page is generated. A stale page means the site is wrong,
      # so the build stops before anything is published.
      - name: api reference is current
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
